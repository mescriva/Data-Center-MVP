<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!--
    Resolución objetivo: 1920×1080 (pantalla tumbada ~122×70 cm)
    Layout: B+C izquierda (2/3) | A derecha (1/3) | D barra inferior
  -->
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>Power Electronics — Data Centers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Barlow: tipografía de carácter técnico-industrial, legible a distancia -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">

    <!-- ══════════════════════════════════════════════════
         MAIN: izquierda B+C (2/3)  |  derecha A (1/3)
         El comercial interactúa con la sección A (derecha)
         que es la parte más accesible desde el lado largo.
    ══════════════════════════════════════════════════ -->
    <main class="main">

      <!-- ─── COLUMNA IZQUIERDA: B (render) + C (gráfica) ─── -->
      <div class="left-col">

        <!-- SECCIÓN B — Render estático del data center -->
        <section class="section-b" id="sectionB" aria-label="Render del data center seleccionado">
          <div class="render-wrap" id="renderWrap">

            <!-- Logo Power Electronics -->
            <div class="render-logo">
              <img src="./assets/logos/logo.jpg" alt="Power Electronics" />
            </div>

            <!-- Imagen del render (cambia según modelo y equipo activo) -->
            <img class="render-img" id="renderImg"
                 src="./assets/renders/m1_labeled.png"
                 alt="Render isométrico del data center" />

            <!-- Etiqueta flotante: modelo activo -->
            <div class="render-badge" id="renderBadge">Line Interactive</div>

          </div>
        </section>

        <!-- SECCIÓN C — Gráfica del modelo / equipo activo -->
        <section class="section-c" id="sectionC" aria-label="Gráfica de rendimiento">
          <div class="graph-header">
            <span class="graph-title" id="graphTitle">Line Interactive — Eficiencia energética</span>
            <span class="graph-subtitle" id="graphSubtitle">Potencia activa vs. reactiva · kW</span>
          </div>
          <!-- Canvas: gráfica generada por JS (placeholder hasta tener .mp4) -->
          <canvas class="graph-canvas" id="graphCanvas"></canvas>
        </section>

      </div><!-- /left-col -->

      <!-- ─── SECCIÓN A — Panel interactivo DERECHA ─── -->
      <aside class="section-a" id="sectionA" aria-label="Selector de equipos y detalles">

        <!-- Cabecera: título del modelo -->
        <header class="a-header">
          <div class="a-model-tag" id="aModelTag">Data Centers</div>
          <h1 class="a-title" id="aTitle">Line Interactive</h1>
          <p class="a-desc" id="aDesc">Cargando…</p>
        </header>

        <!-- Cuerpo: listado de equipos o vista detalle -->
        <div class="a-body" id="aBody"></div>

      </aside>

    </main><!-- /main -->

    <!-- ══════════════════════════════════════════════════
         SECCIÓN D — Barra inferior: selector de modelos
    ══════════════════════════════════════════════════ -->
    <nav class="section-d" id="sectionD" aria-label="Selector de modelo de data center">
      <div class="model-nav" id="modelNav"></div>
    </nav>

  </div><!-- /app -->

  <!-- data.js debe cargarse antes que app.js -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
